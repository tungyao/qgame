<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QGame TileMap Editor</title>
  <link rel="stylesheet" href="./dist/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">QGame TileMap Editor</div>
      <div class="toolbar">
        <button id="newBtn" type="button">新建地图</button>
        <button id="brushBtn" class="active" type="button">画笔</button>
        <button id="eraserBtn" type="button">橡皮擦</button>
        <button id="playBtn" type="button">播放预览</button>
        <button id="overlayBtn" class="active" type="button">碰撞覆盖</button>
        <button id="saveBtn" type="button">保存</button>
        <button id="loadBtn" type="button">读取</button>
        <button id="exportBtn" type="button">导出引擎包</button>
      </div>
      <div id="status" class="status">Ready</div>
    </header>

    <main class="workspace">
      <section class="viewport">
        <div class="stage-wrap">
          <canvas id="mapCanvas"></canvas>
        </div>
      </section>

      <aside class="side side-left">
        <section class="section">
          <h2>地图</h2>
          <div class="row">
            <label for="mapWInput">宽</label>
            <input id="mapWInput" type="number" min="1" max="512" value="20">
            <label for="mapHInput">高</label>
            <input id="mapHInput" type="number" min="1" max="512" value="15">
          </div>
          <div class="row">
            <label for="tileSizeInput">Tile 大小</label>
            <input id="tileSizeInput" type="number" min="4" max="256" value="32">
            <label for="zoomInput">缩放</label>
            <select id="zoomInput">
              <option value="1">100%</option>
              <option value="2" selected>200%</option>
              <option value="3">300%</option>
              <option value="4">400%</option>
            </select>
          </div>
          <div class="row">
            <button id="resizeBtn" type="button">应用尺寸</button>
            <button id="clearLayerBtn" class="danger" type="button">清空当前层</button>
          </div>
          <div class="row">
            <label for="timeInput">预览时间</label>
            <input id="timeInput" type="range" min="0" max="10" step="0.01" value="0">
            <output id="timeOutput">0.00s</output>
          </div>
          <div class="hint">当前导出协议固定为 <code>qgame.tilemap.v2</code>；读取时仍兼容 v1。</div>
        </section>

        <section class="section">
          <h2>Tileset</h2>
          <input id="tilesetFile" type="file" accept="image/*" multiple>
          <div class="row">
            <label for="tilesetColsInput">默认列数</label>
            <input id="tilesetColsInput" type="number" min="1" value="4">
          </div>
          <div id="tilesets" class="tilesets"></div>
        </section>

        <section class="section">
          <h2>Palette</h2>
          <div id="palette" class="palette"></div>
          <div class="hint">角标含义：<code>V</code>=visual，<code>A</code>=animation，<code>C</code>=collision。</div>
        </section>
      </aside>

      <aside class="side side-right">
        <section class="section">
          <h2>图层</h2>
          <div class="row">
            <button id="addLayerBtn" type="button">添加图层</button>
          </div>
          <div id="layers" class="layers"></div>
        </section>

        <section class="section">
          <h2>选中 Tile</h2>
          <div id="selectionSummary" class="summary">未选中</div>
          <div class="row">
            <label for="visualKindSelect">Visual</label>
            <select id="visualKindSelect">
              <option value="static">static</option>
              <option value="flipbook">flipbook</option>
              <option value="wind">wind</option>
              <option value="water">water</option>
              <option value="waterFlipbook">waterFlipbook</option>
              <option value="emissive">emissive</option>
              <option value="autotile">autotile</option>
            </select>
          </div>
          <div class="row">
            <label for="visualSpeedInput">speed</label>
            <input id="visualSpeedInput" type="number" step="0.1" value="1">
            <label for="visualStrengthInput">strength</label>
            <input id="visualStrengthInput" type="number" step="0.1" value="0">
          </div>
          <div class="row">
            <label for="visualPhaseInput">phase</label>
            <input id="visualPhaseInput" type="number" step="0.1" value="0">
            <label for="visualFlagsInput">flags</label>
            <input id="visualFlagsInput" type="number" step="1" min="0" value="0">
          </div>
          <div class="row">
            <label for="animationSpeedInput">anim speed</label>
            <input id="animationSpeedInput" type="number" step="0.1" value="1">
            <label class="checkbox">
              <input id="animationRandomStartInput" type="checkbox">
              randomStart
            </label>
          </div>
          <div class="row">
            <button id="addFrameBtn" type="button">添加帧</button>
            <button id="removeAnimationBtn" class="danger" type="button">移除动画</button>
          </div>
          <div id="animationFrames" class="frames"></div>
        </section>

        <section class="section">
          <h2>碰撞</h2>
          <div class="row">
            <label for="collisionShapeSelect">shape</label>
            <select id="collisionShapeSelect">
              <option value="none">none</option>
              <option value="full">full</option>
              <option value="rect">rect</option>
              <option value="polygon">polygon</option>
              <option value="oneWay">oneWay</option>
              <option value="trigger">trigger</option>
            </select>
          </div>
          <label class="block-label" for="collisionPointsInput">points</label>
          <textarea id="collisionPointsInput" spellcheck="false" placeholder="rect: 0,8,16,8&#10;polygon: 0,0,16,0,16,16"></textarea>
          <div class="hint">Rect 使用 <code>x,y,w,h</code>；Polygon/OneWay 使用 <code>x0,y0,x1,y1,...</code>。</div>
        </section>

        <section class="section">
          <h2>JSON</h2>
          <textarea id="jsonBox" spellcheck="false"></textarea>
          <div class="row">
            <button id="copyJsonBtn" type="button">复制 JSON</button>
            <button id="importJsonBtn" type="button">从文本读取</button>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <input id="loadFile" type="file" accept=".json,application/json" hidden>
  <script src="./dist/main.js"></script>
</body>
</html>
